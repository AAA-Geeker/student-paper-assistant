# ============================================================================
# Nginx HTTP 配置模板（无域名，IP 直连模式）
# 使用方法：将此文件复制为 nginx/nginx.conf
# 注意：本文件需与服务器上生效的 /opt/<proj>/nginx/nginx.conf 保持一致
# ============================================================================

events {}

http {
    # MIME 类型映射 —— 静态资源（截图/PDF）依赖它给出正确的 Content-Type
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend { server backend:8000; }
    upstream frontend { server frontend:80; }

    server {
        listen 80;
        server_name _;

        client_max_body_size 20M;

        gzip on;
        gzip_vary on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
        gzip_min_length 1000;
        gzip_comp_level 5;

        location /api/ {
            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_connect_timeout 10s;
            proxy_buffering off;
        }

        # ─── 作品集（静态页，独立于 SPA）───────────────────────────────
        location /portfolio/ {
            alias /usr/share/nginx/portfolio/;
            index index.html;
            try_files $uri $uri/ /portfolio/index.html;
        }

        location / {
            proxy_pass http://frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

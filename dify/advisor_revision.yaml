# 导师批注修改工作流 — Dify DSL (可导入)
# 用途：advisor_revision 场景。后端 core_features.advisor_annotation_revision 在
#       DIFY_ENABLED=true 且 DIFY_WORKFLOW_IDS["advisor_revision"] 配了 id 时调用。
# 输入变量（与后端发送一致）：text(段落, 论文原文), annotations(段落, 导师批注)
# 输出：result = {{#revision.text#}}
# ⚠️ 导入前把 model.provider 从 -provider-id- 改成你 Dify 里实际的 provider id。
app:
  mode: workflow
  name: 导师批注修改工作流
  description: 解析导师批注 → 逐条修改 → 输出修改后的全文
  icon_type: emoji
  icon: 📌
workflow:
  id: advisor-revision
  title: 导师批注修改工作流
  type: workflow
  environment_variables: []
  conversation_variables: []
  features:
    file_upload:
      enabled: false
  graph:
    viewport:
      x: 0
      y: 0
      zoom: 0.8
    nodes:
      - id: start
        type: start
        title: 开始
        position: { x: 0, y: 100 }
        data:
          type: start
          title: 开始
          variables:
            - variable: text
              label: 论文原文
              required: true
              type: paragraph
            - variable: annotations
              label: 导师批注
              required: true
              type: paragraph
          advanced_settings:
            files: []
      - id: revision
        type: llm
        title: 批注修改
        position: { x: 280, y: 100 }
        data:
          type: llm
          title: 批注修改
          desc: 逐条落实导师批注并输出修改后的全文
          model:
            provider: -provider-id-
            name: deepseek-r1:8b
            mode: chat
            completion_params:
              temperature: 0.4
          prompt_template:
            - role: system
              text: 你是一位有经验的论文写作指导助手，根据导师的批注意见修改论文。
            - role: user
              text: >-
                你正在根据导师的批注意见修改论文。

                导师批注内容：
                {{#start.annotations#}}

                论文原文：
                {{#start.text#}}

                请执行以下步骤：
                1. 逐条解析导师的批注意见
                2. 针对每条批注对原文进行修改（保留未修改的部分不变）
                3. 输出修改后的全文

                输出格式：
                ## 批注解析（每条批注类型：格式/内容/逻辑/语言 + 修改方案）
                ## 修改后的全文
                ## 修改说明（原句 → 修改后 对照）

                请直接输出结果，不要任何前置说明。
          outputs:
            - variable: text
          memory: null
          context:
            enabled: false
      - id: end
        type: answer
        title: 输出
        position: { x: 560, y: 100 }
        data:
          type: answer
          title: 输出
          value:
            - type: variable
              value: '{{#revision.text#}}'
          outputs:
            - variable: result
              value: '{{#revision.text#}}'
    edges:
      - id: e0
        source: start
        target: revision
        type: normal
        sourceHandle: source
        targetHandle: target
      - id: e1
        source: revision
        target: end
        type: normal
        sourceHandle: source
        targetHandle: target

# ============================================================================
# 生产环境 Docker Compose 配置（适配腾讯云 CVM / LightHouse）
# 启动: docker compose -f docker-compose.prod.yml up -d --build
# ============================================================================

services:
  # ─── PostgreSQL 数据库 ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: paper
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper -d paper"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── FastAPI 后端 ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://paper:${POSTGRES_PASSWORD}@db/paper
      SECRET_KEY: ${SECRET_KEY}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-10.0}
      WARN_AT_PERCENT: ${WARN_AT_PERCENT:-80}
      AUTO_DOWNGRADE: ${AUTO_DOWNGRADE:-true}
      DEFAULT_TIER: ${DEFAULT_TIER:-budget}
      MAX_CONTEXT_TOKENS: ${MAX_CONTEXT_TOKENS:-8000}
      SEGMENT_POLISH_SIZE: ${SEGMENT_POLISH_SIZE:-500}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      # ── 邮箱验证（注册发送验证码）──
      EMAIL_SMTP_ENABLED: ${EMAIL_SMTP_ENABLED:-false}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-465}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_CODE_TTL_MINUTES: ${EMAIL_CODE_TTL_MINUTES:-10}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  # ─── 前端 (Nginx 静态文件服务) ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend

  # ─── Nginx 反向代理 ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
